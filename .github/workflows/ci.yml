name: CI

on:
  push:
    branches: [v2, 'feat/**']
  pull_request:
    branches: [v2]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace

  integration:
    name: API integration tests (Atlas)
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      # Private user database per run: these tests reset their user collection
      # up front, so overlapping runs must not share tfs_v2 or they delete each
      # other's fixtures and fail spuriously.
      TFS_USER_DB: tfs_v2_ci_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run ignored API tests
        if: env.MONGODB_URI != ''
        run: cargo test -p tfs-api -- --ignored --test-threads=1
      - name: Skip (MONGODB_URI secret not configured)
        if: env.MONGODB_URI == ''
        run: echo "MONGODB_URI secret not set - skipping Atlas integration tests"

  webui:
    name: Web UI (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build
