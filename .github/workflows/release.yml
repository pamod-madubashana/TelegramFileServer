name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/server/Cargo.toml | head -n1)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::crates/server/Cargo.toml version must use semver format (e.g. 2.0.0)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

  build:
    needs: validate
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install web UI dependencies
        working-directory: webui
        run: npm ci

      - name: Build web UI
        working-directory: webui
        run: |
          npx tsc --noEmit
          npm run build

      - name: Build server
        run: cargo build --locked --release --package tfs --target ${{ matrix.target }}

      - name: Package release (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.name }}
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "release\tfs-v$env:VERSION-$env:PLATFORM"
          New-Item -ItemType Directory -Force -Path "$stage\static" | Out-Null
          Copy-Item "target\$env:TARGET\release\tfs.exe" "$stage\tfs.exe"
          Copy-Item "crates\server\static\*" "$stage\static" -Recurse -Force
          Compress-Archive -Path $stage -DestinationPath "release\tfs-v$env:VERSION-$env:PLATFORM.zip"

      - name: Package release (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.name }}
        run: |
          set -euo pipefail
          stage="release/tfs-v${VERSION}-${PLATFORM}"
          mkdir -p "$stage/static"
          cp "target/${TARGET}/release/tfs" "$stage/tfs"
          cp -R crates/server/static/. "$stage/static/"
          tar -czf "${stage}.tar.gz" -C release "$(basename "$stage")"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/tfs-v${{ needs.validate.outputs.version }}-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Releases go to both repos of the pair. Whichever repo runs the
      # workflow publishes there with its own GITHUB_TOKEN, then mirrors
      # to the other with MIRROR_REPO_TOKEN (a PAT with contents:write on
      # that repo). The mirror step is skipped when the secret is absent.
      MIRROR_REPO: ${{ github.repository == 'The-KLYRO/TelegramFileServer' && 'pamod-madubashana/TelegramFileServer' || 'The-KLYRO/TelegramFileServer' }}
      MIRROR_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release v${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release (mirror repo)
        # No target_commitish here on purpose: the two repos carry the same
        # content under different SHAs (each platform squashes its own merge
        # commits), so this run's sha does not exist in the mirror. An
        # omitted target_commitish tags the mirror's default branch head,
        # which the sync keeps at the same content.
        if: ${{ env.MIRROR_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.MIRROR_REPO }}
          # The token must be the input, not env GITHUB_TOKEN: the action's
          # token input defaults to github.token and takes precedence over
          # the environment, which silently sends this repo's integration
          # token to the mirror and fails with 403.
          token: ${{ env.MIRROR_TOKEN }}
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ env.MIRROR_TOKEN }}
