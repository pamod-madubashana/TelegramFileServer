[package]
name = "tfs"
version = "2.0.0"
edition = "2024"
description = "TelegramFileServer v2 web server — setup wizard, JSON API, and web UI"
license = "MIT OR Apache-2.0"

[[bin]]
name = "tfs"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tower-http = { workspace = true }
tfs-api = { path = "../api" }
tfs-config = { path = "../config" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
